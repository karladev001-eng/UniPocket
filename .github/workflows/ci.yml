name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web (typecheck, tests, TLS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      # scripts/runtime.mjs reads this OS-managed PEM bundle on Linux (the
      # ubuntu runner ships it with ca-certificates). TLS verification is never
      # disabled; verify:tls must reject the compromised certificates.
      UNI_POCKET_CA_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # web/package.json engines: >=26.12.1 <27. "26" resolves to the latest
          # 26.x; scripts/runtime.mjs rejects anything below the patched floor.
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: node --version && npm --version
      - run: npm ci
      # Static checks first so a flaky external TLS probe does not hide them.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run verify:tls
      - run: npm run typecheck
      - run: npm run typecheck:admin
      - run: npm run test:all
      - run: npm run test:integration

  swift:
    name: CampusCore (swift test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Same entry point as local development. It resolves the Xcode developer
      # directory with xcode-select, so no machine-specific path is needed.
      - run: ./scripts/test-core.sh
