<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>022 · カラーと設定行の修正比較</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#202329;font:16px/1.7 -apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}main{max-width:1160px;margin:auto;padding:24px}h1{font-size:28px;line-height:1.4}h2{margin-top:32px;font-size:21px}p{max-width:760px}a{color:#294d83}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.phone{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:16px;overflow:hidden}.name{padding:12px 14px;font-weight:650}.screen{padding:0 14px 16px}.card{background:var(--surface);border:1px solid var(--line);border-radius:13px;overflow:hidden;margin:10px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;padding:10px 14px;font-size:14px}.muted{color:var(--muted);font-size:12px}.field{border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:8px 10px;font-size:14px}.accent{color:var(--accent)}.primary{display:inline-flex;align-items:center;justify-content:center;background:var(--accent);color:var(--on);border-radius:9px;min-height:44px;padding:6px 13px;font-size:13px}.tabs{display:flex;gap:6px;background:var(--soft);border-radius:10px;padding:4px}.tab{flex:1;text-align:center;padding:6px 0;font-size:12px}.active{background:var(--surface);border-radius:7px}.align{display:grid;grid-template-columns:repeat(2,minmax(0,390px));gap:20px}.caption{font-weight:650;margin:10px 0}.sample{padding:12px;background:var(--bg);color:var(--ink);border-radius:16px}.bad{padding-left:2px;justify-content:flex-start}.note{background:#fff;border:1px solid #cbd1d8;border-radius:12px;padding:14px} @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:480px){main{padding:16px}.grid,.align{grid-template-columns:1fr}.phone{max-width:390px}h1{font-size:24px}}
</style></head><body><main><p>022仕様版2 · 承認済みAC4–6・8の補足比較 / 本番未反映</p><h1>色を選んだら、画面全体で伝わる。</h1><p>背景・カード・文字・枠線・選択状態をカラーごとに揃えます。モノトーンは無彩色にし、グリーンが残らないようにします。背景画像・メモの分類色・地図やPDFの内容は元のままです。</p><h2>4色 × ライト・ダーク</h2><div class="grid" id="palettes"></div><h2>お知らせ行の文字位置</h2><div class="align" id="alignment"></div><p class="note">設定行は左右14pxの余白と60pxの高さを揃え、矢印を右端に置きます。新しい設定項目や説明文は追加しません。</p><p><a href="022-article-header-color-mode.md">既存の仕様・承認・修正記録</a></p></main><script>
const palettes=[
['グリーン','ライト','#f2f7f3','#ffffff','#16392a','#53665a','#a8c2af','#deeee2','#15563b','#ffffff'],
['ブルー','ライト','#edf4ff','#fbfdff','#1b304f','#53647e','#a8bad5','#dce8fb','#244e8a','#ffffff'],
['ローズ','ライト','#fff0f5','#fffafb','#4a2336','#785c6a','#d2afc0','#f7dfeb','#7a3757','#ffffff'],
['モノトーン','ライト','#f2f2f2','#ffffff','#262626','#626262','#bdbdbd','#e5e5e5','#333333','#ffffff'],
['グリーン','ダーク','#111d17','#1c2d23','#e4f1e8','#afc8b7','#516d5b','#2c4534','#b9e5c7','#102417'],
['ブルー','ダーク','#101c2f','#1b2c46','#e6efff','#b5c7e3','#4f6b92','#293f60','#bfd8ff','#12233c'],
['ローズ','ダーク','#26141e','#38202d','#fae8f1','#d4b7c6','#805c70','#513245','#f4bfd8','#351726'],
['モノトーン','ダーク','#171717','#262626','#f0f0f0','#bfbfbf','#686868','#363636','#e0e0e0','#202020']];
const vars=p=>['bg','surface','ink','muted','line','soft','accent','on'].map((k,i)=>'--'+k+':'+p[i+2]).join(';');
document.getElementById('palettes').innerHTML=palettes.map(p=>`<section class="phone" style="${vars(p)}"><div class="name">${p[0]}<div class="muted">${p[1]}</div></div><div class="screen"><div class="card"><div class="row"><b>お知らせ・アンケート</b><span class="accent">›</span></div></div><div class="card"><div class="row"><span>背景・テーマ<div class="muted">${p[1]} · 背景なし</div></span><span>⌄</span></div></div><div class="field">検索・入力</div><p><span class="primary">＋ 予定</span></p><div class="tabs"><span class="tab active">ホーム</span><span class="tab">予定表</span><span class="tab">その他</span></div></div></section>`).join('');
document.getElementById('alignment').innerHTML=[false,true].map(after=>`<div><div class="caption">${after?'修正案':'現在の配置'}</div><div class="sample" style="${vars(palettes[7])}"><div class="card"><div class="row ${after?'':'bad'}"><b>お知らせ・アンケート${after?'':' ›'}</b>${after?'<span>›</span>':''}</div></div><div class="card"><div class="row"><b>アプリの更新</b></div><div class="row"><span class="muted">最新です</span></div></div><div class="card"><div class="row"><b>背景・テーマ</b><span>›</span></div></div></div></div>`).join('');
</script></body></html>
