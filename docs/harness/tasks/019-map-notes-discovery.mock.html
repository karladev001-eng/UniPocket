function drawSuggestions(keep=false){const q=document.getElementById('map-query'), list=document.getElementById('map-suggest'),status=document.getElementById('map-status');document.getElementById('map-clear').hidden=!query;status.className='mapstatus sr-only';suggestions=isOnline(query)?[]:findBuildings(query);if(!query){list.hidden=true;status.textContent='';q.setAttribute('aria-expanded','false');return}if(isOnline(query)){list.hidden=true;status.className='mapstatus short';status.textContent='オンライン';q.setAttribute('aria-expanded','false');return}if(!suggestions.length){list.hidden=true;status.className='mapstatus short';status.textContent='見つかりません';q.setAttribute('aria-expanded','false');return}status.textContent=suggestions.length+'件の候補。選択すると地図の中央に表示します。';list.hidden=false;q.setAttribute('aria-expanded','true');if(focused>=0)q.setAttribute('aria-activedescendant','option-'+focused);else q.removeAttribute('aria-activedescendant');const scroll=list.scrollTop;list.innerHTML=suggestions.map((b,i)=>'<button role="option" id="option-'+i+'" aria-selected="'+(focused===i)+'" data-b="'+b.id+'"><span>'+esc(b.name)+'</span><small>'+esc(b.short)+'</small></button>').join('');if(keep)list.scrollTop=scroll;list.querySelectorAll('button').forEach(b=>b.onclick=()=>chooseBuilding(catalog.buildings.find(x=>x.id===b.dataset.b)))}
function chooseBuilding(b){selected=b.id;center=b.mapCenter.slice();document.getElementById('map-query').value=b.name;query=b.name;hideSuggestions();document.getElementById('map-query').blur();document.getElementById('map-status').className='mapstatus sr-only';document.getElementById('map-status').textContent='選択: '+b.name;drawMap()}
function baseSize(){const v=document.getElementById('mapviewport'),r=v.clientWidth/v.clientHeight;return r>1118/1364?[1364*r,1364]:[1118,1118/r]}
function drawMap(){const svg=document.getElementById('mapcanvas');if(!svg)return;const [bw,bh]=baseSize(),w=bw/zoom,h=bh/zoom;svg.setAttribute('viewBox',[center[0]-w/2,center[1]-h/2,w,h].join(' '));document.getElementById('scale').textContent='全体基準 '+zoom.toFixed(1)+'倍';const b=catalog.buildings.find(b=>b.id===selected),hi=document.getElementById('map-highlight');hi.innerHTML=b?'<polygon points="'+b.mapPolygon.map(p=>p.join(',')).join(' ')+'" fill="#ffca4266" stroke="#9a5104" stroke-width="7"/><circle cx="'+b.mapCenter[0]+'" cy="'+b.mapCenter[1]+'" r="17" fill="#9a5104" stroke="white" stroke-width="7"/>':'';const msg=document.getElementById('map-selected');msg.hidden=!b;if(b)msg.textContent=b.name;document.getElementById('zoom-in').disabled=zoom>=4;document.getElementById('zoom-out').disabled=zoom<=1}
function bindMapDrag(){const v=document.getElementById('mapviewport'),pts=new Map();let last=null,dist=null;v.onpointerdown=e=>{if(e.target.closest('button'))return;pts.set(e.pointerId,[e.clientX,e.clientY]);v.setPointerCapture(e.pointerId);last=[e.clientX,e.clientY];dist=null};v.onpointermove=e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(dist)zoom=Math.max(1,Math.min(4,zoom*d/dist));dist=d}else if(last){const [bw,bh]=baseSize();center[0]-=(e.clientX-last[0])*bw/zoom/v.clientWidth;center[1]-=(e.clientY-last[1])*bh/zoom/v.clientHeight;center[0]=Math.max(-200,Math.min(1318,center[0]));center[1]=Math.max(-200,Math.min(1564,center[1]))}last=[e.clientX,e.clientY];drawMap()};v.onpointerup=v.onpointercancel=e=>{pts.delete(e.pointerId);last=null;dist=null};v.onwheel=e=>{e.preventDefault();zoom=Math.max(1,Math.min(4,zoom*(e.deltaY<0?1.12:1/1.12)));drawMap()}}
function renderEvent(){phone.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="event-title"><header class="modalhead"><h2 id="event-title">情報リテラシー演習とデータの整理・活用</h2><button class="close" id="event-close" aria-label="予定詳細を閉じる">×</button></header><div class="eventbody"><div class="eventmeta">10月20日（火）10:20–11:50 · 授業</div><button class="location" id="event-location">情13 ↗ キャンパスマップ</button><label class="memo-label" for="event-memo">この予定のメモ</label><textarea id="event-memo" maxlength="5000" placeholder="持ち物や、この回に確認したいこと。">'+esc(memoText)+'</textarea><div class="saveline"><span id="save-status" role="status">保存済み</span><span id="memo-count">'+memoText.length+' / 5000</span></div><div id="memo-recovery"></div><p class="helper">この回の予定だけに保存します。入力を止めると自動保存。</p><button class="edit" id="event-edit">予定を編集</button></div></section>';document.getElementById('event-memo').oninput=e=>{memoText=e.target.value;clearTimeout(memoTimer);saveState='saving';showSaveState();document.getElementById('memo-count').textContent=memoText.length+' / 5000';memoTimer=setTimeout(()=>persistMemo(),500)};document.getElementById('event-close').onclick=()=>leaveEvent(()=>changeScreen('home'));document.getElementById('event-location').onclick=()=>leaveEvent(()=>showHomeLocation('102'));document.getElementById('event-edit').onclick=()=>leaveEvent(()=>toast('保存完了。既存の予定編集へ進みます'));showSaveState()}
function showSaveState(){const s=document.getElementById('save-status');if(!s)return;s.textContent=saveState==='saving'?'保存中…':saveState==='saved'?'保存済み':'保存できません';s.className=saveState==='failed'?'error':'';const r=document.getElementById('memo-recovery');r.innerHTML=saveState==='failed'?'<div class="recovery">'+(memoMode==='conflict'?'別タブの変更を検出しました。入力を無断で上書きしません。':'保存できませんでした。入力はこの画面に残っています。')+'<div class="row"><button id="memo-retry">再試行</button><button id="memo-export">入力を書き出す</button></div></div>':'';if(saveState==='failed'){document.getElementById('memo-retry').onclick=()=>{memoMode='success';document.getElementById('memo-demo').value='success';persistMemo(true)};document.getElementById('memo-export').onclick=()=>{const b=new Blob([memoText],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='架空予定のメモ.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}}}
async function persistMemo(force=false){clearTimeout(memoTimer);if(savePromise)return savePromise;if(!force&&saveState==='saved')return true;saveState='saving';showSaveState();savePromise=new Promise(resolve=>setTimeout(()=>{const ok=memoMode==='success';saveState=ok?'saved':'failed';if(ok)savedMemo=memoText;showSaveState();savePromise=null;resolve(ok);if(ok&&pendingAction){const next=pendingAction;pendingAction=null;next()}},750));return savePromise}

function renderArticles(){phone.innerHTML='<main class="page articles"><div class="heading articlehead"><h1>記事</h1><button id="register">＋ 登録</button></div><div class="searchrow"><input id="article-query" type="search" aria-label="記事検索" placeholder="タイトル・紹介文で検索" value="'+esc(articleQuery)+'"><button id="filter" aria-label="記事を絞り込む・適用'+[filterCategory,filterCourse,filterAuthor].filter(Boolean).length+'件">'+articleIcon('filter')+'<span>'+([filterCategory,filterCourse,filterAuthor].filter(Boolean).length||'')+'</span></button></div><div class="tabs"><button id="popular" class="'+(sort==='popular'&&!bookmarked?'active':'')+'" aria-pressed="'+(sort==='popular'&&!bookmarked)+'">人気</button><button id="newest" class="'+(sort==='newest'&&!bookmarked?'active':'')+'" aria-pressed="'+(sort==='newest'&&!bookmarked)+'">新着</button><button id="bookmarked" class="'+(bookmarked?'active':'')+'" aria-pressed="'+bookmarked+'">ブックマーク</button></div><div id="filter-strip"></div><div id="article-list"></div></main>'+nav('articles');document.getElementById('article-query').oninput=e=>{articleQuery=e.target.value;updateArticles()};document.getElementById('popular').onclick=()=>{sort='popular';bookmarked=false;render()};document.getElementById('newest').onclick=()=>{sort='newest';bookmarked=false;render()};document.getElementById('bookmarked').onclick=()=>{sort='newest';bookmarked=true;render()};document.getElementById('filter').onclick=showFilters;document.getElementById('register').onclick=()=>toast('記事の登録は既存機能を利用します');updateArticles()}
function updateArticles(){const strip=document.getElementById('filter-strip'),list=document.getElementById('article-list');strip.innerHTML=[filterCategory,filterCourse,filterAuthor].filter(Boolean).length?'<div class="filterstrip">'+[filterCategory,filterCourse,filterAuthor].filter(Boolean).map(esc).join(' / ')+'<button id="filter-clear">解除</button></div>':'';document.getElementById('filter-clear')?.addEventListener('click',()=>{filterCategory=filterCourse=filterAuthor='';render()});if(articleMode==='loading'){list.innerHTML='<p class="muted" role="status">記事を取得しています…</p><div class="skeleton"></div><div class="skeleton"></div>';return}if(articleMode==='none'){list.innerHTML='<div class="empty">記事はまだありません。<br><button id="first-register">記事を登録する</button></div>';document.getElementById('first-register').onclick=()=>toast('記事登録は既存機能を利用します');return}let rows=articles.filter(a=>(!bookmarked||a.marked)&&(!filterCategory||a.category===filterCategory)&&(!filterCourse||a.course===filterCourse)&&(!filterAuthor||a.author===filterAuthor)&&(!articleQuery||(a.title+a.summary).includes(articleQuery)));rows.sort((a,b)=>sort==='popular'?(b.recent+b.bms*3)-(a.recent+a.bms*3)||b.created-a.created:b.created-a.created);let prefix=articleMode==='failed'?'<div class="failure" role="alert">記事を更新できませんでした。<br>前回取得した記事を表示しています。<br><button id="retry-articles">再試行</button></div>':'';list.innerHTML=prefix+(rows.length?rows.map((a,i)=>'<article class="card"><div class="row between"><span class="pill">'+esc(a.category)+'</span><small>'+(sort==='popular'?'人気 '+(i+1):'新着')+'</small></div><h3><a style="color:inherit;text-decoration:none" href="#article-'+a.id+'" data-article="'+a.id+'">'+esc(a.title)+'</a></h3><p class="summary">'+esc(a.summary)+'</p><div class="articlemeta"><span class="viewcount" aria-label="閲覧'+a.views+'回">'+articleIcon('eye')+'<span aria-hidden="true">'+a.views+'</span></span><button class="bookmark" data-bookmark="'+a.id+'" aria-pressed="'+a.marked+'" aria-label="ブックマーク'+a.bms+'件、'+(a.marked?'解除する':'登録する')+'">'+articleIcon('bookmark',a.marked)+'<span aria-hidden="true">'+a.bms+'</span></button></div><small>'+esc(a.author)+'</small></article>').join(''):'<div class="empty">条件に合う記事はありません。<br><button id="clear-search">検索・絞り込みを解除</button></div>');document.getElementById('clear-search')?.addEventListener('click',()=>{articleQuery=filterCategory=filterCourse=filterAuthor='';bookmarked=false;render()});document.getElementById('retry-articles')?.addEventListener('click',()=>{articleMode='ready';document.getElementById('article-demo').value='ready';updateArticles()});list.querySelectorAll('[data-bookmark]').forEach(b=>b.onclick=()=>{const a=articles.find(a=>a.id===b.dataset.bookmark);a.marked=!a.marked;a.bms+=a.marked?1:-1;b.innerHTML=articleIcon('bookmark',a.marked)+'<span aria-hidden="true">'+a.bms+'</span>';b.setAttribute('aria-pressed',String(a.marked));b.setAttribute('aria-label','ブックマーク'+a.bms+'件、'+(a.marked?'解除する':'登録する'));toast('ブックマークを'+(a.marked?'保存':'解除')+'しました。順位は再取得時に更新します')});list.querySelectorAll('[data-article]').forEach(a=>a.onclick=e=>{e.preventDefault();toast('記事本文は既存の表示を利用します（架空記事）')})}
