function syncBg(){app.querySelectorAll('[data-bg]').forEach(b=>{b.setAttribute('aria-pressed',String(b.dataset.bg===chosenBg));if(b.dataset.bg==='own')b.querySelector('img').src=ownImage});const s=document.getElementById('bg-state');if(s)s.textContent=bgStatus==='loading'?'画像を読み込んでいます…':bgStatus==='error'?'画像を読み込めませんでした。前の画像を表示しています。':bgStatus==='unselected'?'自分の画像はまだありません。':chosenBg==='none'?'背景なし':chosenBg==='own'?'自分の画像を選択中':'サンプルを選択中';app.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));applyBg()}
function detail(b){let title=b.dataset.title||'情報デザイン',time=b.dataset.time||'10:20–11:50',room=b.dataset.room||'共12';if(b.querySelector('.overlap')){openSheet('このコマの予定 · 2件',`<button class="setting-row" data-action="detail" data-title="${esc(title)}" data-time="${time}" data-room="${room}"><span>${esc(title)}<small>${time} · ${room}</small></span></button><button class="setting-row" data-action="detail" data-title="先生に相談" data-time="10:20–10:40" data-room="研究室">先生に相談 · 研究室</button>`);return}openSheet('予定の詳細',`<h3 class="detail-title">${esc(title)}</h3><dl class="detail-meta"><dt>日時</dt><dd>10月19日 月曜日<br>${esc(time)}</dd><dt>場所</dt><dd>${esc(room)}</dd></dl><div class="sheet-actions"><button class="primary" data-action="edit" data-title="${esc(title)}">編集する</button><button class="small-btn" data-action="close">閉じる</button></div>`)}
function edit(title=''){openSheet(title?'予定を編集':'予定を追加',`<label>予定名<input id="demo-title" value="${esc(title)}" placeholder="予定名"></label><label>日時<input value="2026-10-19 10:20"></label><label>場所<input value="共12"></label><p>操作を確認するための見本です。</p><div class="sheet-actions"><button class="primary" data-action="demo-save">見本に反映</button><button class="small-btn" data-action="close">キャンセル</button></div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab||b.dataset.previewTab){tab=b.dataset.tab||b.dataset.previewTab;render();return}if(b.dataset.scenario){scenario=b.dataset.scenario;tab=scenario==='empty'||scenario==='saveFailure'?'home':'week';weekend=false;view='week';render();return}if(b.dataset.update){updateState=b.dataset.update;tab='more';render();return}if(b.dataset.bgState){bgStatus=b.dataset.bgState;tab='more';render();showBackground();if(bgStatus==='unselected'){app.querySelector('[data-bg="own"]').innerHTML='<span class="bg-image" style="display:grid;place-items:center">＋</span><span class="bg-label">画像を選ぶ</span>';app.querySelector('[data-bg="own"]').dataset.action='file';delete app.querySelector('[data-bg="own"]').dataset.bg}return}if(b.dataset.viewport){const [w,h]=b.dataset.viewport.split('x');app.style.width=w+'px';app.style.height=h+'px';document.querySelectorAll('[data-viewport]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}if(b.dataset.bg){chosenBg=b.dataset.bg;bgStatus='selected';syncBg();return}if(b.dataset.theme){theme=b.dataset.theme;syncBg();return}if(b.dataset.shift){weekOffset+=Number(b.dataset.shift);render();return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.day){view='day';render();return}
switch(b.dataset.action){case 'close':closeSheet();break;case 'detail':detail(b);break;case 'edit':edit(b.dataset.title);break;case 'add':edit();break;case 'demo-save':closeSheet();break;case 'menu':openSheet('時間割',`<button class="setting-row" data-action="import">PDFを取り込む<span class="chevron">›</span></button><button class="setting-row" data-action="registered">登録講義を確認<span class="chevron">›</span></button>`);break;case 'import':openSheet('PDFを取り込む','<p>既存のPDF取込画面へ進む入口です。</p><button class="primary full-width" data-action="close">閉じる</button>');break;case 'registered':openSheet('登録講義','<p>基礎情報学 / 情報デザイン / 情報社会 / 数学演習 / 統計学 / 英語 / プロジェクト演習 / ゼミ</p>');break;case 'weekend':weekend=true;render();break;case 'weekday':weekend=false;render();break;case 'today':weekOffset=0;weekend=[0,6].includes(new Date().getDay());render();break;case 'background':showBackground();break;case 'file':document.getElementById('bg-file').click();break;case 'none':chosenBg='none';bgStatus='selected';syncBg();break;case 'check':updateState='checking';render();setTimeout(()=>{updateState='latest';if(tab==='more')render()},900);break;case 'install':updateState='latest';render();break;case 'retry-save':scenario='normal';render();break;case 'pwa':openSheet('ホーム画面に追加','<p>Safariの共有メニューから「ホーム画面に追加」を選んでください。</p>');break;case 'user':openSheet('ユーザー','<p>ゲストで利用中です。</p><p>端末のデータを消すと、匿名ユーザーの情報は復元できません。必要なデータは書き出してください。</p>');break;case 'data':openSheet('データ','<button class="setting-row" data-action="close">データを書き出す<span class="chevron">↗</span></button><p>この見本では書き出し・削除は行いません。</p>');break;case 'info':openSheet('詳細情報','<p>Uni Pocket<br>診断用 build：表示例</p>');break;case 'week':openSheet('時間割の表示','<p>日 / 週 / 月の切替は時間割から行えます。</p><button class="setting-row" data-tab="week">時間割を開く<span class="chevron">›</span></button>');break;case 'link':case 'links':openSheet('施設・リンク','<button class="setting-row" data-action="map">キャンパスマップ<span class="chevron">›</span></button><p>施設の営業時間は通常期の目安です。臨時変更は公式情報をご確認ください。</p>');break;case 'map':openSheet('キャンパスマップ',templates.home.match(/<button class="mini-map"[\s\S]*?<\/button>/)[0]+'<p>地図の拡大画面は今回の再設計の対象外です。</p>');break}});
document.addEventListener('change',e=>{if(e.target.id!=='bg-file')return;const file=e.target.files?.[0];if(!file)return;bgStatus='loading';syncBg();if(!file.type.startsWith('image/')){bgStatus='error';syncBg();return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{ownImage=reader.result;chosenBg='own';bgStatus='selected';syncBg()};img.onerror=()=>{bgStatus='error';syncBg()};img.src=reader.result};reader.onerror=()=>{bgStatus='error';syncBg()};reader.readAsDataURL(file)});
document.addEventListener('keydown',e=>{const s=app.querySelector('.sheet');if(!s)return;if(e.key==='Escape'){closeSheet();return}if(e.key==='Tab'){const f=[...s.querySelectorAll('button,input:not([hidden]),select,a[href]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0]?.focus()}}});
window.demo={show:(t,s='normal')=>{tab=t;scenario=s;view='week';render()},update:s=>{updateState=s;tab='more';render()},background:showBackground};render();
</script></body></html>
