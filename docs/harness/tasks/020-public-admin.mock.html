else if(screen==='notices'){content=header('お知らせ','home')+(badState('お知らせ')||'<button class="note-row" data-go="notice"><small>'+(!noticeRead?'<span class="unread"></span>':'')+'10/20　お知らせ</small><b>'+esc(publicAnnouncement.title)+'</b><small>11/3まで</small></button><button class="note-row" data-go="survey"><small>回答募集中　·　11/3まで</small><b>Uni Pocketの使い心地</b><small>3問 / 約1分　回答は任意</small></button>')}
else if(screen==='notice'){noticeRead=true;content=header('お知らせ','notices')+'<small>10月20日　/　11月3日まで</small><h2 style="margin-top:23px;line-height:1.6">'+esc(publicAnnouncement.title)+'</h2><p class="bodycopy">'+esc(publicAnnouncement.body)+'</p><small>Uni Pocket 運営</small>'}
else if(screen==='install'){content=header('ホーム画面に追加','settings')+'<p class="muted">いつものURLから開いて、ホーム画面に置けます。</p><label class="field" for="os">使う端末</label><select id="os"><option value="ios">iPhone / Safari</option><option value="android">Android / Chrome</option></select><div id="install-steps" class="card"></div><h2 style="margin-top:28px;font-size:16px">URLを共有</h2><div class="inline-code">https://uni-pocket.example.invalid/</div><small>モック専用の架空URL · 実際の公開URLではありません</small><button class="linebtn" style="margin-top:10px" id="share-url">URLの文字を選択</button><details class="compact-details"><summary>共有する前に</summary>一般公開後はリンクを転送できます。URLを知らない第三者も到達し得ます。noindexは閲覧制限ではありません。</details>'}
else if(screen==='settings'){content=header('その他')+'<button class="note-row" data-go="install"><b>ホーム画面に追加・URLを共有 ›</b></button><button class="note-row" data-go="notices"><b>お知らせ ›</b></button><label class="toggle"><span><b style="font-size:14px;font-weight:550">利用状況の集計に協力する</b><br><small>任意 / いつでも停止できます</small></span><input id="usage" type="checkbox" '+(usage?'checked':'')+' aria-label="利用状況の集計に協力する"></label><small id="usage-status">'+(usage?'ON · このモック内でのみ変更':'OFF · 初期設定')+'</small><details class="compact-details"><summary>収集するもの</summary>ONの場合、起動と画面の種類を匿名のブラウザIDで集計します。予定・メモ・PDF・検索文・位置情報は集めません。<p>記事の閲覧・現在のブックマーク、お知らせの開封、回答に必要な件数の集計は、任意の利用状況と分けます。</p></details>'}
else if(screen==='survey'){content=header('アンケート','notices')+surveyView()}
else if(screen==='publicArticles'){content=header('記事')+'<div class="row between"><small>登録した記事はすぐ公開</small><button class="linebtn" data-info="記事登録は既存機能。登録直後に公開され、運営は後から非表示にできます。">＋ 登録</button></div>'+articles.filter(a=>a.status==='published').map(a=>'<button class="note-row" data-publicarticle="'+a.id+'"><span class="tag">'+esc(a.category)+'</span><b>'+esc(a.title)+'</b><small>'+esc(a.author)+'　'+a.views+'閲覧 · '+a.bookmarks+'保存</small></button>').join('')}
$('#app').innerHTML='<main class="page">'+content+'</main>'+publicNav();if(screen==='install')installSteps('ios');if(screen==='survey')bindSurvey();}
function installSteps(os){$('#install-steps').innerHTML=os==='ios'?'<h3>iPhone / Safari</h3><p style="font-size:14px">1. SafariでURLを開く<br>2. 共有メニューを開く<br>3.「ホーム画面に追加」を選ぶ<br>4.「追加」を押す</p><small>OSの表示はバージョンにより異なります。追加には端末での操作が必要です。</small>':'<h3>Android / Chrome</h3><p style="font-size:14px">1. ChromeでURLを開く<br>2. ︙ メニューを開く<br>3.「ホーム画面に追加」または<br>「アプリをインストール」を選ぶ</p><small>利用環境により表示名が異なります。</small>'}
function surveyView(){if(surveyResult==='success'||surveyResult==='duplicate')return '<div class="empty"><span class="tag">'+(surveyResult==='success'?'回答完了':'回答済み')+'</span><h2 style="margin-top:22px">'+(surveyResult==='success'?'回答ありがとうございました':'この利用環境では回答済みです')+'</h2><p class="muted">同じ回答を再送しても二重計上しません。</p><button class="linebtn" data-go="home">ホームへ</button></div>'+surveyTestControls();if(surveyResult==='closed')return '<div class="empty"><h2>回答受付は終了しました</h2><p class="muted">入力した内容はこの画面に残しています。<br>締切後の送信は受け付けません。</p><button class="linebtn" data-go="home">ホームへ</button></div>'+surveyTestControls();return '<span class="tag">回答は任意</span><h2 style="margin-top:17px;line-height:1.6">'+esc(publicSurvey.title)+'</h2><p class="muted">'+esc(publicSurvey.intro)+'<br>11月3日 23:59まで · 約1分</p>'+(surveyResult==='failed'?'<div class="notice warn" role="alert">送信できませんでした。入力は残っています。接続を確認して再送できます。</div>':'')+'<form id="answer-form">'+publicSurvey.questions.map((q,i)=>'<fieldset class="question"><legend>'+(i+1)+'. '+esc(q.title)+'<small>'+(q.required?'必須':'任意')+'</small></legend>'+(q.type==='text'?'<textarea id="answer-text-'+i+'" name="answer'+i+'" maxlength="1000" '+(q.required?'required':'')+'>'+esc(answers[i]||'')+'</textarea><small>個人情報は書かないでください。1000文字まで。</small>':q.options.split('\n').filter(Boolean).slice(0,10).map((o,j)=>'<label class="choice"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="answer'+i+'" value="'+esc(o)+'" '+((q.type==='single'?answers[i]===o:(answers[i]||[]).includes(o))?'checked':'')+' '+(q.required&&q.type==='single'?'required':'')+'>'+esc(o)+'</label>').join(''))+'</fieldset>').join('')+'<button class="action" type="submit" '+(surveyResult==='sending'?'disabled':'')+'>'+(surveyResult==='sending'?'送信中…':'回答を送信')+'</button><small style="display:block;margin-top:12px">同じ匿名ユーザーIDにつき1回答。別ブラウザの同一人物判定は行いません。</small></form>'+surveyTestControls()}
function surveyTestControls(){return '<details class="compact-details"><summary>モックの回答状態を試す</summary><label class="field" for="send-mode">次の送信結果</label><select id="send-mode"><option value="success" '+(sendMode==='success'?'selected':'')+'>成功</option><option value="failed" '+(sendMode==='failed'?'selected':'')+'>通信失敗・入力保持</option><option value="closed" '+(sendMode==='closed'?'selected':'')+'>送信時に締切到達</option><option value="duplicate" '+(sendMode==='duplicate'?'selected':'')+'>同じIDは回答済み</option></select><button id="reset-answer">入力画面に戻す</button></details>'}
function bindSurvey(){const form=$('#answer-form');if(form){const capture=()=>{publicSurvey.questions.forEach((q,i)=>{answers[i]=q.type==='text'?form.querySelector('[name="answer'+i+'"]').value:q.type==='single'?(form.querySelector('[name="answer'+i+'"]:checked')?.value||''):[...form.querySelectorAll('[name="answer'+i+'"]:checked')].map(x=>x.value)})};form.addEventListener('input',capture);form.onsubmit=e=>{e.preventDefault();capture();if(publicSurvey.questions.some((q,i)=>q.required&&(!answers[i]||Array.isArray(answers[i])&&!answers[i].length))){toast('必須の設問に回答してください');return}if(state==='failed'||state==='offline'){surveyResult='failed';render();return}surveyResult='sending';render();setTimeout(()=>{surveyResult=sendMode;render()},650)}}$('#send-mode').onchange=e=>sendMode=e.target.value;$('#reset-answer').onclick=()=>{surveyResult='input';render()}}
function adminShell(content){return '<div class="admin-layout"><aside class="adminnav"><div class="brand">Uni Pocket<span style="color:#b7cc9c">.</span></div><small>ADMIN / 提案</small><div class="mobile-admin-title">Uni Pocket · 管理 / 提案</div><nav class="adminlinks" aria-label="管理区画">'+navs.map(([s,t])=>'<button data-go="'+s+'" class="'+(screen===s||(s==='announcements'&&screen==='noticeEditor')||(s==='surveys'&&screen.startsWith('survey'))?'active':'')+'">'+t+'</button>').join('')+'</nav><footer>所有者 · 本人確認済み<br>Asia / Tokyo<br><br>架空データ · 配信なし</footer></aside><main class="adminmain">'+content+'</main></div>'}

else if(screen==='surveys'){c=adminTop('アンケート','<button class="action" data-go="surveyEditor">＋ 作成</button>')+(badState('アンケート')||'<table class="table"><thead><tr><th>題名 / 締切</th><th>状態</th><th>回答</th></tr></thead><tbody><tr><td><button data-go="surveyEditor">'+esc(survey.title)+'<small>3問 / 11/3 23:59まで</small></button></td><td><span class="tag">'+statusLabel(survey.status)+'</span></td><td><button data-go="surveyResults">24 ›</button></td></tr><tr><td><button data-go="surveyResults">秋学期の使い心地<small>回答受付中 / 11/3まで</small></button></td><td><span class="tag">公開中</span></td><td><button data-go="surveyResults">24 ›</button></td></tr></tbody></table>')}

.status!=='draft'?'disabled':'')+'>'+esc(q.options)+'</textarea>':'<small>自由記述は1000文字まで。個人情報を避ける案内を表示。</small>')+'</section>').join('')+editFailure()+'<div class="editorfooter"><button type="button" class="linebtn" id="save-survey">下書き保存</button><button class="action" type="submit">回答画面を確認 ›</button></div></form>'}
else if(screen==='surveyResults'){c=adminTop('回答の集計','<button class="quietlink" data-go="surveys">一覧へ ›</button>')+'<p class="muted">秋学期の使い心地 / 架空24回答</p><div class="stats" style="grid-template-columns:repeat(2,1fr)"><div class="stat"><small>回答数</small><b>24</b></div><div class="stat"><small>自由記述</small><b>8<small> 件</small></b></div></div><div class="twocol"><section><h3>よく使う機能は？</h3>'+[['予定',15,63],['時間割',6,25],['記事',3,12]].map(([t,n,w])=>'<div class="row between"><small>'+t+'</small><small>'+n+'件</small></div><div class="bar"><span style="width:'+w+'%"></span></div>').join('')+'<small>単一選択 / 24回答。複数選択は回答者数と選択数を区別。</small></section><section class="card"><h3>匿名の自由記述</h3><p style="font-size:13px">「予定がすぐに見られるのが便利です。」</p><small>架空の回答。個人名・メールの収集はしません。</small><button class="linebtn" id="free-csv" style="margin-top:15px">自由記述CSV</button></section></div><details class="compact-details"><summary>回答の扱い</summary>同じ匿名ユーザーIDにつき1回答。別ブラウザの同一人物判定はしません。管理者のみ閲覧可能。個別回答の保持は終了後90日を上限にする提案です。</details>'}
else if(screen==='analytics'){c=adminTop('利用状況','<button class="linebtn" id="metrics-csv">集計CSV</button>')+'<div class="row between"><div class="subnav" style="margin:0">'+[['7','7日'],['30','30日'],['custom','期間指定']].map(([v,t])=>'<button data-period="'+v+'" class="'+(period===v?'active':'')+'">'+t+'</button>').join('')+'</div><small>日本時間 · 10/20 12:00 集計</small></div>'+(period==='custom'?'<div class="filters"><input type="date" id="range-start" aria-label="集計開始日" value="2026-10-01"><input type="date" id="range-end" aria-label="集計終了日" value="2026-10-20"><button class="linebtn" id="apply-range">適用</button><small>最大90日</small></div>':'')+(badState('利用状況')||'<div class="stats"><div class="stat"><small>記事の閲覧</small><b>'+(period==='7'?'640':'2,184')+'</b><small>コンテンツの操作</small></div><div class="stat"><small>現在のブックマーク</small><b>78</b><small>集計時点の件数</small></div><div class="stat"><small>お知らせの開封</small><b>'+(period==='7'?'62':'184')+'</b><small>版ごとの開封</small></div><div class="stat"><small>アンケート回答</small><b>24</b><small>受付済み件数</small></div></div><div class="twocol"><section class="card"><div class="row between"><h3 style="margin:0">記事の閲覧</h3><small><span class="legenddot"></span>日別</small></div><div class="chart"><svg viewBox="0 0 420 140" role="img" aria-label="架空の記事閲覧。14日54、15日72、16日66、17日96、18日81、19日119、20日152。"><path d="M15 30H410M15 70H410M15 110H410" stroke="#e6eadf" stroke-dasharray="3 5" fill="none"/><path d="M15 111 80 95 145 100 210 76 275 87 340 55 405 25V132H15Z" fill="#e4ebd9"/><path d="M15 111 80 95 145 100 210 76 275 87 340 55 405 25" stroke="#829d6b" stroke-width="2.5" fill="none"/></svg><div class="chartlabels"><span>'+(period==='7'?'10/14':'9/21')+'</span><span>10/20</span></div></div></section><section><h3>任意協力の利用状況</h3><div class="metric"><span>利用環境数 · 日別</span><b>未収集</b></div><div class="metric"><span>起動回数 · 30分単位</span><b>未収集</b></div><div class="metric"><span>本日の新規ブックマーク</span><b>0件</b></div><small style="display:block;margin-top:14px">0件は収集済みで該当なし。未収集は協力対象の値がありません。実人数・インストール台数ではありません。</small></section></div><details class="compact-details"><summary>数字の定義・保持期限</summary><p>利用環境数は任意協力をONにしたブラウザIDの日次重複除去。起動は30分ごとの区切り。人気記事の直近7日スコアと累計閲覧を分けます。</p><p>任意の起動・画面種類は初期OFF。予定・メモ・PDF・検索文・IP・端末指紋をanalyticsに保存しません。イベント明細30日、終了アンケートの個別回答90日、集計と監査365日を上限にする提案です。</p><p>現在のブックマークは集計時点の値で、期間選択では変わりません。お知らせ開封は版・匿名IDごとに重複除去し、母数がない開封率は出しません。復元できない過去は未収集で示します。集計CSVは件数と日時のみ。自由記述はアンケート画面の別操作で出力します。</p></details>')}
$('#app').innerHTML=adminShell(c);if(screen==='articles')renderArticleRows();if(screen==='noticeEditor')bindNoticeEditor();if(screen==='surveyEditor')bindSurveyEditor();}
function statusLabel(s){return ({draft:'下書き',published:'公開中',scheduled:'予約',ended:'終了'})[s]||s}
function editFailure(){return state==='conflict'?'<div class="notice warn" role="alert">別の更新を検出しました（409）。入力を保持します。最新の版を確認してから再保存してください。</div>':state==='failed'||state==='offline'?'<div class="notice warn" role="alert">保存できません。入力はこの画面に残っています。</div>':''}
function renderArticleRows(){const el=$('#article-rows');if(!el)return;const bad=badState('記事');if(bad){el.innerHTML=bad;return}const rows=articles.filter(a=>(articleFilter==='reports'?a.reports>0:a.status===articleFilter)&&(!query||(a.title+a.author+a.category).includes(query)));el.innerHTML=rows.length?'<table class="table"><thead><tr><th>記事 / 投稿者</th><th>状態</th><th class="countcol">閲覧 / 保存</th><th>通報</th></tr></thead><tbody>'+rows.map(a=>'<tr><td><button data-article="'+a.id+'">'+esc(a.title)+'<small>'+esc(a.author)+' · '+esc(a.category)+'</small></button></td><td><span class="tag '+(a.status==='hidden'?'warn':'')+'">'+(a.status==='hidden'?'非表示':'公開中')+'</span></td><td class="countcol">'+a.views+' / '+a.bookmarks+'</td><td>'+a.reports+'</td></tr>').join('')+'</tbody></table>':'<div class="empty">条件に合う記事はありません。<br><button id="clear-search">検索を解除</button></div>';el.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>articleDetail(Number(b.dataset.article)));$('#clear-search')?.addEventListener('click',()=>{query='';$('#article-search').value='';renderArticleRows()});el.querySelectorAll('[data-retry]').forEach(b=>b.onclick=resetState)}
function articleDetail(id){const a=articles.find(x=>x.id===id);chosenArticle=id;showDialog('記事の管理','<span class="tag">'+(a.status==='hidden'?'非表示':'公開中')+'</span><h3 style="margin-top:18px;line-height:1.6">'+esc(a.title)+'</h3><p class="muted">'+esc(a.author)+' · '+esc(a.category)+'<br>閲覧 '+a.views+' / ブックマーク '+a.bookmarks+'</p><p class="inline-code">https://notion.example.invalid/article-'+a.id+'</p><small>元Notionリンクの架空例。本文はここでは編集しません。</small>'+(a.reports?'<div class="notice warn">未確認の通報 '+a.reports+'件<br>理由例：リンク不備 / 補足：元ページを開けません。<br><button id="resolve-report">確認済みにする</button></div>':'')+(a.status==='hidden'?'<p style="font-size:13px;margin-top:18px">非表示の理由<br>'+esc(a.reason)+'</p>':'<label class="field" for="hide-reason">非表示の理由 · 作者にも表示</label><textarea id="hide-reason" maxlength="500" placeholder="例：リンク先を確認できないため">'+esc(a.reason)+'</textarea>'),[{label:a.status==='hidden'?'再公開を確認':'非表示を確認',primary:true,fn:()=>{const reason=$('#hide-reason')?.value.trim()||a.reason;if(a.status==='published'&&!reason){$('#hide-reason').setCustomValidity('理由を入力してください');$('#hide-reason').reportValidity();$('#hide-reason').oninput=()=>$('#hide-reason').setCustomValidity('');return}showDialog(a.status==='hidden'?'この記事を再公開しますか？':'この記事を非表示にしますか？','<p>'+esc(a.title)+'</p><p>'+esc(reason)+'</p><small>元の記事・著者・閲覧 '+a.views+' / 保存 '+a.bookmarks+' は保持します。Notion元ページは変更しません。</small>',[{label:'戻る',fn:()=>articleDetail(id)},{label:a.status==='hidden'?'再公開する':'非表示にする',primary:true,fn:()=>{if(state==='failed'||state==='conflict'||state==='offline'){a.reason=reason;articleDetail(id);toast('更新できません。理由の入力を保持しています');return}a.status=a.status==='hidden'?'published':'hidden';a.reason=reason;closeDialog();render();toast('モック内で状態を変更しました')}}])}}]);$('#resolve-report')?.addEventListener('click',()=>{a.reports=0;closeDialog();render();toast('モック内で確認済みにしました')})}
function captureNotice(){announcement.title=$('#notice-title').value;announcement.body=$('#notice-body').value;announcement.link=$('#notice-link').value;announcement.start=$('#notice-start').value;announcement.end=$('#notice-end').value;announcement.dirty=true}
function bindNoticeEditor(){const f=$('#notice-form');f.oninput=captureNotice;$('#save-notice').onclick=()=>{captureNotice();if(state==='failed'||state==='offline'||state==='conflict'){toast('保存できません。入力を保持しています');return}announcement.dirty=false;toast('モック内で下書きを保存しました')};f.onsubmit=e=>{e.preventDefault();captureNotice();if(announcement.link&&!announcement.link.startsWith('https://')){$('#notice-link').setCustomValidity('httpsのリンクを入力してください');$('#notice-link').reportValidity();$('#notice-link').oninput=()=>$('#notice-link').setCustomValidity('');return}if(announcement.end<=announcement.start){toast('表示終了は開始より後にしてください');return}previewNotice()};$('#end-notice')?.addEventListener('click',()=>showDialog(announcement.status==='ended'?'公開を再開しますか？':'公開を終了しますか？','<p>利用者の一覧への表示を変更します。内容は保持します。</p>',[{label:'キャンセル',fn:closeDialog},{label:announcement.status==='ended'?'再開する':'終了する',primary:true,fn:()=>{announcement.status=announcement.status==='ended'?'published':'ended';announcement.dirty=false;closeDialog();render()}}]))}
function previewNotice(){showDialog('利用者への表示','<div class="preview-label">提案プレビュー · 実配信なし</div><small>10月20日 / '+esc(announcement.end.replace('T',' '))+'まで</small><h3 style="margin-top:15px">'+esc(announcement.title)+'</h3><p class="bodycopy">'+esc(announcement.body)+'</p>'+(announcement.link?'<p class="inline-code">'+esc(announcement.link)+'</p>':'')+'<div class="notice">全員向け · アプリ内のみ<br>'+esc(announcement.start.replace('T',' '))+' 開始</div>',[{label:'編集に戻る',fn:closeDialog},{label:'公開の確認へ',primary:true,fn:()=>showDialog('この内容を公開しますか？','<p>全員向けのお知らせとして表示します。開始が未来なら予約されます。</p><p><b>'+esc(announcement.title)+'</b><br>'+esc(announcement.start.replace('T',' '))+' — '+esc(announcement.end.replace('T',' '))+'</p><small>このモックでは実際の公開・送信は行いません。</small>',[{label:'戻る',fn:previewNotice},{label:'モックで公開',primary:true,fn:()=>{if(['failed','offline','conflict'].includes(state)){closeDialog();toast('更新できません。入力は保持しています');return}announcement.status=announcement.start>'2026-10-20T12:00'?'scheduled':'published';announcement.dirty=false;closeDialog();screen='announcements';render();toast('モック内で'+statusLabel(announcement.status)+'にしました')}}])}])}
function captureSurvey(){survey.title=$('#survey-title').value;survey.intro=$('#survey-intro').value;survey.start=$('#survey-start').value;survey.end=$('#survey-end').value;document.querySelectorAll('[data-qtitle]').forEach(e=>survey.questions[Number(e.dataset.qtitle)].title=e.value);document.querySelectorAll('[data-qoptions]').forEach(e=>survey.questions[Number(e.dataset.qoptions)].options=e.value);document.querySelectorAll('[data-qrequired]').forEach(e=>survey.questions[Number(e.dataset.qrequired)].required=e.checked);survey.dirty=true}
function bindSurveyEditor(){const f=$('#survey-form');f.oninput=captureSurvey;$('#add-question').onclick=()=>{captureSurvey();if(survey.questions.length<10)survey.questions.push({type:'single',title:'新しい設問',required:false,options:'選択肢1\n選択肢2'});render()};document.querySelectorAll('[data-qtype]').forEach(e=>e.onchange=()=>{captureSurvey();const q=survey.questions[Number(e.dataset.qtype)];q.type=e.value;if(!q.options)q.options='選択肢1\n選択肢2';render()});$('#save-survey').onclick=()=>{captureSurvey();if(survey.status!=='draft'){previewSurvey();return}if(['failed','offline','conflict'].includes(state)){toast('保存できません。入力を保持しています');return}survey.dirty=false;toast('モック内で下書きを保存しました')};$('#duplicate-survey')?.addEventListener('click',()=>{captureSurvey();survey.status='draft';survey.title+='（新しい版）';render()});f.onsubmit=e=>{e.preventDefault();captureSurvey();if(survey.end<=survey.start){toast('締切は表示開始より後にしてください');return}if(survey.questions.some(q=>q.type!=='text'&&(q.options.split('\n').filter(Boolean).length<2||q.options.split('\n').filter(Boolean).length>10))){toast('選択肢は各設問2〜10件にしてください');return}previewSurvey()}}
function previewSurvey(){showDialog('回答画面のプレビュー','<div class="preview-label">提案プレビュー · 回答・配信なし</div><h3>'+esc(survey.title)+'</h3><p class="muted">'+esc(survey.intro)+'</p>'+survey.questions.map((q,i)=>'<fieldset class="question"><legend>'+(i+1)+'. '+esc(q.title)+' <small>'+(q.required?'必須':'任意')+'</small></legend>'+(q.type==='text'?'<textarea aria-label="プレビュー自由記述" placeholder="個人情報は書かないでください" maxlength="1000"></textarea>':q.options.split('\n').filter(Boolean).map(o=>'<label class="choice"><input type="'+(q.type==='single'?'radio':'checkbox')+'" name="preview'+i+'">'+esc(o)+'</label>').join(''))+'</fieldset>').join(''),[{label:'編集に戻る',fn:closeDialog},{label:'公開の確認へ',primary:true,fn:()=>showDialog('アンケートを公開しますか？','<p><b>'+esc(survey.title)+'</b><br>'+survey.questions.length+'問 / '+esc(survey.end.replace('T',' '))+'締切</p><p>公開後は設問・選択肢を固定します。題名・紹介・締切は確認して変更できます。</p><small>このモックでは実際に配信しません。</small>',[{label:'戻る',fn:previewSurvey},{label:'モックで公開',primary:true,fn:()=>{if(['failed','offline','conflict'].includes(state)){closeDialog();toast('更新できません。入力は保持しています');return}survey.status=survey.start>'2026-10-20T12:00'?'scheduled':'published';survey.dirty=false;closeDialog();screen='surveys';render();toast('モック内で'+statusLabel(survey.status)+'にしました')}}])}])}
function showDialog(title,body,actions){if(!$('#dialog').open)focusReturn=document.activeElement;$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;$('#dialog-actions').innerHTML=actions.map((a,i)=>'<button class="'+(a.primary?'action':'linebtn')+'" data-dialogaction="'+i+'">'+a.label+'</button>').join('');$('#dialog-actions').querySelectorAll('button').forEach((b,i)=>b.onclick=actions[i].fn);if(!$('#dialog').open)$('#dialog').showModal();$('#dialog-close').focus()}
function closeDialog(){$('#dialog').close();if(focusReturn?.isConnected)focusReturn.focus()}
$('#dialog-close').onclick=closeDialog;$('#dialog').addEventListener('cancel',e=>{e.preventDefault();closeDialog()});
function resetState(){state='ready';$('#state-mini').value=state;render()}
function toast(msg){clearTimeout(timer);$('#toast').textContent=msg;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,3500)}
function csv(name,contents){showDialog('架空データのCSVを書き出す','<p>このモックの架空データだけをファイルにします。実際の回答や利用履歴は含みません。</p><p><b>'+esc(name)+'</b></p>',[{label:'キャンセル',fn:closeDialog},{label:'架空CSVを保存',primary:true,fn:()=>{const url=URL.createObjectURL(new Blob(['\uFEFF'+contents],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);closeDialog();toast('架空CSVを生成しました')}}])}
function bind(){document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(b.dataset.reports)articleFilter='reports';go(b.dataset.go)});document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>toast(b.dataset.info+'（提案モック）'));document.querySelectorAll('[data-retry]').forEach(b=>b.onclick=resetState);document.querySelectorAll('[data-reauth]').forEach(b=>b.onclick=resetState);document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{articleFilter=b.dataset.filter;render()});document.querySelectorAll('[data-article]').forEach(b=>b.onclick=()=>articleDetail(Number(b.dataset.article)));document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{period=b.dataset.period;render()});document.querySelectorAll('[data-publicarticle]').forEach(b=>b.onclick=()=>{const a=articles.find(a=>a.id===Number(b.dataset.publicarticle));showDialog(a.title,'<p class="muted">'+esc(a.author)+'</p><p>記事本文はNotionで表示する既存の流れです。</p><small>架空記事 / 外部ページは開きません。</small>',[{label:'通報する',fn:()=>showReport(a.id)}])});$('#article-search')?.addEventListener('input',e=>{query=e.target.value;renderArticleRows()});$('#os')?.addEventListener('change',e=>installSteps(e.target.value));$('#usage')?.addEventListener('change',e=>{usage=e.target.checked;$('#usage-status').textContent=usage?'ON · このモック内でのみ変更':'OFF · 集計への協力を停止'});$('#share-url')?.addEventListener('click',()=>showDialog('共有URL · 架空例','<p>次の文字を選択してコピーできます。実際の公開URLではありません。</p><input id="fake-url" aria-label="架空の共有URL" readonly value="https://uni-pocket.example.invalid/">',[{label:'閉じる',fn:closeDialog}]));$('#share-url')?.addEventListener('click',()=>{$('#fake-url').select()});$('#free-csv')?.addEventListener('click',()=>csv('架空_アンケート自由記述.csv','回答日時,自由記述\r\n2026-10-20 10:00,予定がすぐに見られるのが便利です（架空）\r\n'));$('#metrics-csv')?.addEventListener('click',()=>csv('架空_コンテンツ集計.csv','日付,日本時間,記事閲覧,現在のブックマーク,お知らせ開封,回答\r\n2026-10-20,12:00,152,78,12,4\r\n'));$('#apply-range')?.addEventListener('click',()=>{const days=(new Date($('#range-end').value)-new Date($('#range-start').value))/86400000+1;if(!Number.isFinite(days)||days<1||days>90){toast('開始から終了まで1〜90日を指定してください');return}toast('架空の期間集計を表示しています（'+days+'日）')})}
const reported=new Set();function showReport(id){showDialog('記事を通報','<p class="muted">気になる点を運営に知らせます。</p><label class="field" for="report-reason">理由</label><select id="report-reason"><option>不適切</option><option>誤情報</option><option>リンク不備</option><option>その他</option></select><label class="field" for="report-extra">補足（任意）</label><textarea id="report-extra" maxlength="500"></textarea>',[{label:'送信する',primary:true,fn:()=>{if(state==='failed'||state==='offline'){toast('送信できません。通報の入力は残っています。上端を通常に戻して再送できます');return}if(!reported.has(id)){articles.find(a=>a.id===id).reports++;reported.add(id)}closeDialog();toast('モック内で受け付けました。同じ未処理通報は重複しません')}}])}
$('#scene-mini').onchange=e=>go(e.target.value);$('#state-mini').onchange=e=>{state=e.target.value;render()};window.addEventListener('beforeunload',e=>{if(announcement.dirty||survey.dirty){e.preventDefault();e.returnValue=''}});const initial=new URLSearchParams(location.search).get('screen');if([...scenes.map(x=>x[0]),'notices','survey','settings','surveyResults','noticeEditor','surveyEditor'].includes(initial))screen=initial;render();
</script></body></html>
