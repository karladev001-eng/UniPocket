<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>提案v8・場所から地図へ</title><body style="margin:0"><style>
.v8-demo{width:375px;height:667px;background:#FAFBFA;color:#263730;font:14px -apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;position:relative;overflow:hidden}.v8-scroll{height:621px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}.v8-top{height:621px;position:relative}.v8-top img{display:block;width:375px;height:667px;max-width:none}.v8-hit{position:absolute;background:transparent;border:0;cursor:pointer;border-radius:5px}.v8-hit:focus-visible{outline:3px solid #8A5314;outline-offset:-2px}.v8-map{padding:25px 18px 32px;background:#FAFBFA;min-height:560px;box-sizing:border-box}.v8-map h3{font-size:21px;margin:8px 0}.v8-map p{line-height:1.7}.v8-map .sub{color:#607168;font-size:12px;margin:0 0 16px}.v8-map svg{display:block;width:100%;height:auto;background:#F0F4F1;border-radius:16px}.v8-map .pin{opacity:0}.v8-map.selected .pin{opacity:1}.v8-map .building{fill:#DCE4DF;stroke:#97A89D;stroke-width:1}.v8-map.selected .building-a{fill:#F3D394;stroke:#8A5314;stroke-width:2}.v8-map .place-card{padding:16px;margin-top:16px;border-radius:12px;background:#EDF3EF}.v8-map.selected .place-card{background:#FFF0CE;border-left:3px solid #8A5314}.v8-map strong{display:block;font-size:17px}.v8-map .detail{font-size:12px;margin-top:6px;line-height:1.7}.v8-map .back{border:0;background:none;color:#3C6452;min-height:44px;padding:0;text-decoration:underline;font-size:13px;cursor:pointer}.v8-tabs{position:absolute;bottom:0;height:46px;width:375px;overflow:hidden;background:#FAFBFA}.v8-tabs img{position:absolute;top:-621px;left:0;width:375px;height:667px;max-width:none}.v8-empty{height:275px;background:#F0F4F1;border-radius:14px;display:grid;place-content:center;text-align:center;padding:20px;box-sizing:border-box}.v8-empty p{font-size:13px;color:#607168}.v8-map svg text{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;fill:#46594E;font-size:12px}.v8-note{font-size:12px;color:#607168}
</style><div class="v8-demo"><div class="v8-scroll" tabindex="0" aria-label="ホームをスクロールして地図を見る"><div class="v8-top"><img src="v8-home-light.png" alt="週の時間割。次の授業を黄土色で強調。教室名に下線。"><button class="v8-hit" style="left:148px;top:275px;width:43px;height:51px" aria-label="工2-31を地図で見る" onclick="var d=this.closest('.v8-demo'),m=d.querySelector('.v8-map');m.classList.add('selected');m.querySelector('strong').textContent='① 工2-31';m.querySelector('.detail').textContent='建物 A・3階（登録例）';d.querySelector('.v8-scroll').scrollTo({top:621,behavior:'auto'});m.querySelector('h3').focus({preventScroll:true})"></button><button class="v8-hit" style="left:250px;top:570px;width:105px;height:44px" aria-label="次の授業の工2-31を地図で見る" onclick="var d=this.closest('.v8-demo'),m=d.querySelector('.v8-map');m.classList.add('selected');m.querySelector('strong').textContent='① 工2-31';m.querySelector('.detail').textContent='建物 A・3階（登録例）';d.querySelector('.v8-scroll').scrollTo({top:621,behavior:'auto'});m.querySelector('h3').focus({preventScroll:true})"></button></div><section class="v8-map"><p class="sub">ホームの続き</p><h3 tabindex="-1">キャンパスマップ</h3><p class="sub">保存した画像 · オフラインで表示</p><svg viewBox="0 0 339 286" role="img" aria-label="架空のキャンパス配置図。建物A、B、C、食堂、広場。実際の浜松キャンパスの配置ではありません。"><path d="M0 165 H339 M168 0 V286" stroke="#FAFBFA" stroke-width="22"/><rect x="21" y="23" width="111" height="85" rx="6" class="building building-a"/><rect x="201" y="28" width="108" height="62" rx="6" class="building"/><rect x="25" y="200" width="109" height="60" rx="6" class="building"/><rect x="215" y="195" width="94" height="64" rx="6" class="building"/><rect x="202" y="112" width="108" height="34" rx="15" fill="#DAE7D9"/><text x="77" y="79" text-anchor="middle">建物 A</text><text x="255" y="65" text-anchor="middle">建物 B</text><text x="79" y="235" text-anchor="middle">建物 C</text><text x="261" y="232" text-anchor="middle">食堂</text><text x="256" y="134" text-anchor="middle">広場</text><g class="pin"><circle cx="77" cy="39" r="16" fill="#8A5314" stroke="#FFF0CE" stroke-width="3"/><text x="77" y="44" text-anchor="middle" style="fill:white;font-size:14px;font-weight:700">1</text><path d="M72 53 L77 61 L82 53" fill="#8A5314"/></g></svg><div class="place-card" aria-live="polite"><strong>場所を選ぶと、ここに表示</strong><div class="detail">時間割の下線付きの教室名から確認できます。</div></div><p class="v8-note">※ 地図・建物・教室の対応は説明用の架空例です。</p><button class="back" onclick="this.closest('.v8-demo').querySelector('.v8-scroll').scrollTo({top:0,behavior:'auto'})">↑ 時間割に戻る</button></section></div><div class="v8-tabs"><img src="v8-home-light.png" alt="ホーム・施設・メモ・リンク"></div></div></body></html>
